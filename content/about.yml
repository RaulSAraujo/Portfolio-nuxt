title: Sobre mim
description: Raul Silva Araujo — Desenvolvedor Front-end em Franca, SP. Mais de 6 anos na Deltatec, formado em DSM pela Fatec Franca.
content: |
  Prazer em conhecer! Meu nome é **Raul Silva Araujo**, moro em **Franca, São Paulo** e sou desenvolvedor front-end na **Deltatec** há mais de **6 anos**.

  Atuo no desenvolvimento **web e mobile** do sistema interno, em equipe com dois back-ends. Conduzi a migração para **Nuxt 4**, **Vue 3**, **Nuxt UI** e **TypeScript**, com foco em componentização, performance e integração com APIs REST. Também desenvolvo **automação de processos** — cotações com Playwright e, antes, planilhas com VBA.

  ### Trajetória

  Minha carreira na Deltatec começou em **2016** como aprendiz em outras áreas da empresa e evoluiu por suporte de compras, edição de imagens para e-commerce e, desde **abril de 2021**, desenvolvimento front-end e mobile. Antes disso, atuei em atendimento e vendas na Eletrônica Vila Nova.

  ### Formação

  Cursando **DSM — Desenvolvimento de Software Multiplataforma** na Fatec Franca (2021–2025). Também tenho técnico em TI pelo Senac e técnico em Eletrônica pela ETEC Getúlio Vargas.

  ### Além do código

  Sou **gamer** — curto Valorant, League of Legends e sou fã da saga **Resident Evil**. Café é meu combustível favorito para programar.

  Confira meus [projetos](/projects) ou [entre em contato](/#contact) para conversar ou colaborar.

